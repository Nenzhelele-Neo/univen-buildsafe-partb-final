<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | UNIVEN BuildSafe</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<a class="skip-link" href="#main-content">Skip to main content</a>
<main id="main-content" class="auth-card">
  <a class="logo" href="index.html" aria-label="UNIVEN BuildSafe home">UNIVEN<span>BuildSafe</span></a>
  <h1>Sign in to BuildSafe</h1>
  <p>Access campus work, safety notices, route guidance, and reporting.</p>
  <form id="loginForm">
    <label for="email">Email address</label>
    <input id="email" type="email" required autocomplete="email" placeholder="name@univen.ac.za">
    <label for="password">Password</label>
    <input id="password" type="password" required autocomplete="current-password" placeholder="Enter your password">
    <button class="btn full" type="submit">Login</button>
    <p id="error" class="error" role="alert" aria-live="assertive"></p>
  </form>
  <aside class="demo" aria-label="Demonstration accounts">
    <b>Demo accounts</b><br>
    Admin: admin@univen.ac.za / admin123<br>
    Student: student@univen.ac.za / student123
  </aside>
</main>
<script src="js/login.js"></script>
</body>
</html>
